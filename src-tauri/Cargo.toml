[package]
name = "meet-god"
version = "0.1.0"
edition = "2021"

[lib]
name = "meet_god_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 框架
tauri = { version = "2", features = ["tray-icon"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 音频捕获
cpal = "0.15"

# 音频重采样
rubato = "0.14"

# HTTP 客户端 (LLM / STT API 调用)
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking"] }

# Windows API (隐蔽性)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

# 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# 错误处理
anyhow = "1"
thiserror = "1"

# whisper-rs: 需要 libclang，安装 LLVM 后启用
# 启用方式: cargo build --features whisper-local
# 或安装 LLVM: https://github.com/llvm/llvm-project/releases
[dependencies.whisper-rs]
version = "0.11"
optional = true

[features]
default = []
whisper-local = ["dep:whisper-rs"]
